DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TRAIN_U:
    SAME_AS_X: True
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.002
  MAX_EPOCH: 10
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20
  COUNT_ITER: "smaller_one"

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  NAME: "StylePromptMTDA"
  COCOOP:
    N_CTX: 4
    CTX_INIT: "a photo of a"
    PREC: "fp16"
  STYLE_PROMPT_MTDA:
    PREC: "fp16"
    DEBUG:
      PRINT_ONCE: false
  STYLE_PROMPT:
    ENABLED: true
    STYLE_LAYER: 3
    TOKEN_SCOPE: "patch"
    DOMAIN_STYLE_MLP_HIDDEN: 128
    BETA_INIT: 0.0
    BETA_LEARNABLE: true
    LOSS: "source_ce_plus_target_entropy"
    LAMBDA_ENT: 0.01
    EPS: 1e-6
