DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 8
  TRAIN_U:
    SAME_AS_X: True
    BATCH_SIZE: 8
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.002
  MAX_EPOCH: 10
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20
  COUNT_ITER: "smaller_one"

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  COCOOP:
    N_CTX: 4
    CTX_INIT: "a photo of a"
    PREC: "fp16"

  COCOOP_DA:
    INJECT_LAYER: 3
    MODIFY_CLS: false
    ADAPT_MODE: "s2t"

    STATS:
      TYPE: "ema"
      MOMENTUM: 0.99
      EPS: 1e-6

    GATE:
      TYPE: "token_channel"
      INIT_BIAS: -2.0

    LOSS:
      LAMBDA_CONS: 0.1
      LAMBDA_ENT: 0.01

    TRAIN:
      STAGE: 1
      FREEZE_VISUAL: true
      FREEZE_TEXT: true
      TRAIN_PROMPT_LEARNER: false
      PROMPT_LR_MULT: 0.2

    EVAL:
      USE_ADAPTED_TARGET: true

    DEBUG:
      PRINT_ONCE: false
