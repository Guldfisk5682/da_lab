DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TRAIN_U:
    SAME_AS_X: True
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.002
  MAX_EPOCH: 10
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20
  COUNT_ITER: "smaller_one"

TEST:
  EVAL_EVERY_EPOCH: false

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  NAME: "CLIPTSSPMTDA"
  CLIP_TSSP_MTDA:
    PREC: "amp"
    HIDDEN_DIM: 512
    USE_GAP_TOKEN: true
    STYLE_GROUP_SIZE: 1
    GAP_GROUP_SIZE: 1
    USE_IMAGE_TOKENS: false
    IMAGE_GROUP_SIZE: 1
    ENABLE_VPT: false
    N_VCTX: 8
    VCTX_INIT_STD: 0.02
    GAP_POSITION: "after_target"
    PROTO_MOMENTUM: 0.9
    STYLE_EPS: 1e-6
    LAMBDA_EM: 0.0
    DETACH_ENTROPY_TEXT: false
    ENTROPY_EPS: 1e-8
    LAMBDA_KL: 0.0
    KL_TEMPERATURE: 1.0
    LAMBDA_PL: 0.0
    PL_THRESHOLD: 0.7
    PL_STUDENT_THRESHOLD: 0.7
    PL_USE_STUDENT_LOW_CONF_MASK: true
    PROMPT_TEMPLATE: "{}."
    ZS_PROMPT_TEMPLATE: "a photo of a {}."
    DEBUG:
      PRINT_ONCE: false
